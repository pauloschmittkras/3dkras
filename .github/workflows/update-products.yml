name: Atualizar produtos da galeria

on:
  schedule:
    - cron: '0 */2 * * *'   # a cada 2 horas (nos horários cheios, em UTC)
  workflow_dispatch: {}      # permite rodar manualmente pela aba Actions

jobs:
  update-products:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pandas

      - name: Rodar script de atualização
        run: python update_products.py

      - name: Commitar products.json (se mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --staged --quiet || git commit -m "Atualiza products.json automaticamente"
          git push